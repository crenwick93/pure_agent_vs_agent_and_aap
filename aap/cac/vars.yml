---
# AAP Configuration as Code — Developer Self-Service catalog
# 20 job templates. Only "Provision Dev Sandbox" has a real playbook.
# The rest are placeholders so the agent has a realistic selection problem.

controller_credential_types: []

controller_credentials:
  - name: "Benchmark SSH Key"
    description: "SSH access to benchmark EC2 instances (ec2-user)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ probe_ssh_key }}"

  - name: "AWS Benchmark"
    description: "AWS credentials for EC2 provisioning and inventory"
    organization: "Default"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key }}"
      password: "{{ aws_secret_key }}"

controller_projects:
  - name: "Developer Self-Service Playbooks"
    description: "Playbooks backing the developer self-service catalog"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

controller_inventories:
  - name: "Developer Sandboxes"
    description: "EC2 instances tagged benchmark=aap-token-bench"
    organization: "Default"

controller_inventory_sources:
  - name: "AWS EC2 Discovery"
    inventory: "Developer Sandboxes"
    source: "ec2"
    credential: "AWS Benchmark"
    overwrite: true
    update_on_launch: true
    source_vars:
      plugin: amazon.aws.aws_ec2
      regions:
        - "{{ lookup('env', 'AWS_REGION') | default('eu-west-1', true) }}"
      filters:
        "tag:benchmark": "aap-token-bench"
      hostnames:
        - tag:Name
      compose:
        ansible_host: public_ip_address
        ansible_user: "'ec2-user'"
        ansible_become: "true"

# --- Job Templates ---
controller_templates:

  # 1. Provision Dev Sandbox (REAL PLAYBOOK)
  - name: "Provision Dev Sandbox"
    description: >-
      Creates a new RHEL EC2 sandbox with requested packages, SSH hardening,
      and CMDB registration. Requires: team, memory_gb, packages, ttl_days.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/provision-dev-sandbox.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Provision sandbox survey"
      description: "Variables for new sandbox provisioning"
      spec:
        - question_name: "RHEL version"
          variable: "rhel_version"
          type: "integer"
          default: 10
          required: true
        - question_name: "Memory (GB)"
          variable: "memory_gb"
          type: "multiplechoice"
          choices: "4\n8\n16\n32"
          default: "8"
          required: true
        - question_name: "Packages"
          variable: "packages"
          type: "text"
          default: ""
          required: false
        - question_name: "Team"
          variable: "team"
          type: "text"
          default: "default"
          required: false
        - question_name: "TTL (days)"
          variable: "ttl_days"
          type: "integer"
          default: 7
          required: true

  # 2. Extend Sandbox TTL
  - name: "Extend Sandbox TTL"
    description: >-
      Extends the teardown date of an existing sandbox. Does not change config.
      Requires: instance_id, ttl_days. Max 30 days.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Extend TTL survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "New TTL (days)"
          variable: "ttl_days"
          type: "integer"
          default: 7
          required: true

  # 3. Teardown Sandbox
  - name: "Teardown Sandbox"
    description: >-
      Terminates a sandbox, removes its security group and CMDB entry.
      Irreversible. Requires: instance_id.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Teardown survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true

  # 4. Refresh DB From Prod
  - name: "Refresh DB From Prod"
    description: >-
      Loads a sanitised production database copy into a sandbox's PostgreSQL.
      Sandbox must already exist with Postgres running. Requires: instance_id,
      source_db, target_db.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "DB refresh survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Source database"
          variable: "source_db"
          type: "text"
          default: "payments_prod"
          required: true
        - question_name: "Target database"
          variable: "target_db"
          type: "text"
          default: "payments_dev"
          required: true

  # 5. Rotate Dev Credentials
  - name: "Rotate Dev Credentials"
    description: >-
      Rotates database passwords and API keys on a sandbox. Does not affect
      production. Requires: instance_id.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Credential rotation survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true

  # 6. Seed Test Data
  - name: "Seed Test Data"
    description: >-
      Loads a named fixture dataset into a sandbox database. Truncates first
      unless append mode. Requires: instance_id, fixture_set.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Seed data survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Fixture set"
          variable: "fixture_set"
          type: "multiplechoice"
          choices: "payments-happy-path\nedge-cases-refunds\nload-test-10k\nminimal"
          required: true

  # 7. Snapshot Sandbox
  - name: "Snapshot Sandbox"
    description: >-
      Creates an AMI snapshot of a sandbox for later restore. Requires:
      instance_id.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Snapshot survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true

  # 8. Restore Sandbox
  - name: "Restore Sandbox"
    description: >-
      Replaces a sandbox with a new instance from a saved AMI snapshot.
      Old instance is terminated. Requires: instance_id, ami_id.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Restore survey"
      description: ""
      spec:
        - question_name: "Instance ID to replace"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "AMI ID"
          variable: "ami_id"
          type: "text"
          required: true

  # 9. Resize Sandbox
  - name: "Resize Sandbox"
    description: >-
      Changes the instance type of a sandbox (stop → resize → start).
      Data preserved. Requires: instance_id, instance_type.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Resize survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "New instance type"
          variable: "instance_type"
          type: "multiplechoice"
          choices: "t3.small\nt3.medium\nt3.large\nt3.xlarge\nt3.2xlarge"
          default: "t3.large"
          required: true

  # 10. Attach Shared Volume
  - name: "Attach Shared Volume"
    description: >-
      Creates and attaches an EBS volume to a sandbox, or attaches an existing
      one. Requires: instance_id, mount_path.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Attach volume survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Mount path"
          variable: "mount_path"
          type: "text"
          default: "/mnt/shared"
          required: true

  # 11. Grant Temp DB Access
  - name: "Grant Temp DB Access"
    description: >-
      Creates a time-limited PostgreSQL user on a sandbox. Auto-drops after
      TTL. Requires: instance_id, database_name, access_level, ttl_hours.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Temp DB access survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Database name"
          variable: "database_name"
          type: "text"
          required: true
        - question_name: "Access level"
          variable: "access_level"
          type: "multiplechoice"
          choices: "readonly\nreadwrite"
          default: "readonly"
          required: true
        - question_name: "TTL (hours)"
          variable: "ttl_hours"
          type: "integer"
          default: 8
          required: true

  # 12. Rebuild App Config
  - name: "Rebuild App Config"
    description: >-
      Reinstalls packages and resets config on an existing sandbox without
      reprovisioning. Requires: instance_id, packages.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Rebuild config survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Packages"
          variable: "packages"
          type: "text"
          required: true

  # 13. Run Integration Suite
  - name: "Run Integration Suite"
    description: >-
      Runs a named integration test suite against a sandbox and returns
      results. Requires: instance_id, test_suite.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Integration test survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Test suite"
          variable: "test_suite"
          type: "multiplechoice"
          choices: "payments-api\nauth-service\nfull-stack\nsmoke"
          required: true

  # 14. Sync Secrets
  - name: "Sync Secrets"
    description: >-
      Pulls latest dev secrets from the vault onto a sandbox. Requires:
      instance_id, team.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Sync secrets survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Team"
          variable: "team"
          type: "text"
          required: true

  # 15. Open Firewall Port
  - name: "Open Firewall Port"
    description: >-
      Adds an inbound security group rule on a sandbox for a specified port
      and CIDR. Requires: instance_id, port, source_cidr.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Open port survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Port"
          variable: "port"
          type: "integer"
          required: true
        - question_name: "Source CIDR"
          variable: "source_cidr"
          type: "text"
          required: true

  # 16. Tail App Logs
  - name: "Tail App Logs"
    description: >-
      Returns the last N lines of a log file or journald unit from a sandbox.
      Requires: instance_id, log_source.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Tail logs survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Log source"
          variable: "log_source"
          type: "text"
          default: "postgresql"
          required: true
        - question_name: "Lines"
          variable: "line_count"
          type: "integer"
          default: 100
          required: false

  # 17. Restart App Services
  - name: "Restart App Services"
    description: >-
      Restarts systemd services on a sandbox and waits for active state.
      Requires: instance_id, services.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Restart services survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true
        - question_name: "Services (comma-separated)"
          variable: "services"
          type: "text"
          default: "postgresql"
          required: true

  # 18. Check Sandbox Health
  - name: "Check Sandbox Health"
    description: >-
      Runs a health check on a sandbox: SSH, disk, memory, CPU, services.
      Requires: instance_id.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "Benchmark SSH Key"
    survey_enabled: true
    survey_spec:
      name: "Health check survey"
      description: ""
      spec:
        - question_name: "Instance ID"
          variable: "instance_id"
          type: "text"
          required: true

  # 19. List Team Sandboxes
  - name: "List Team Sandboxes"
    description: >-
      Lists all active sandboxes for a team with IDs, types, and TTL remaining.
      Requires: team.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "List sandboxes survey"
      description: ""
      spec:
        - question_name: "Team"
          variable: "team"
          type: "text"
          required: true

  # 20. Report Sandbox Spend
  - name: "Report Sandbox Spend"
    description: >-
      Generates a cost report for a team's sandbox EC2 usage over a period.
      Requires: team, report_days.
    organization: "Default"
    job_type: "run"
    project: "Developer Self-Service Playbooks"
    playbook: "playbooks/placeholder.yml"
    inventory: "Developer Sandboxes"
    ask_variables_on_launch: true
    credentials:
      - "AWS Benchmark"
    survey_enabled: true
    survey_spec:
      name: "Spend report survey"
      description: ""
      spec:
        - question_name: "Team"
          variable: "team"
          type: "text"
          required: true
        - question_name: "Period (days)"
          variable: "report_days"
          type: "integer"
          default: 30
          required: true
