---
# provision-dev-sandbox.yml — Create and configure a RHEL developer sandbox on AWS.
#
# This is the real playbook behind the "Provision Dev Sandbox" job template.
# Four follow-on templates are also real (open port, health, restart, tail
# logs) so a multi-request session is like-for-like. The remaining 15 are
# placeholders so the agent still has a 20-item catalog to search.
#
# Survey variables (passed via AAP job template survey):
#   team          (text)         — team requesting the sandbox
#   memory_gb     (choice)       — 4, 8, 16, or 32
#   packages      (text)         — e.g. "postgresql16,nginx"
#   rhel_version  (int)          — defaults to 10
#   ttl_days      (int)          — auto-teardown tag, defaults to 7
#
# Stubs:
#   - CMDB registration writes /tmp/cmdb.json instead of calling ServiceNow.
#   - Teardown is tag-based. Run ./scripts/cleanup.sh after testing.

- name: Provision developer sandbox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('eu-west-1', true) }}"
    ssh_key_name: "{{ lookup('env', 'SSH_KEY_NAME') | default('agent_test', true) }}"
    dev_cidr: "{{ lookup('env', 'DEV_CIDR') | default('0.0.0.0/0', true) }}"
    cmdb_path: "{{ lookup('env', 'CMDB_PATH') | default('/tmp/cmdb.json', true) }}"

    _rhel_version: "{{ rhel_version | default(10) }}"
    _memory_gb: "{{ memory_gb | default(8) }}"
    _packages: "{{ packages | default('') }}"
    _team: "{{ team | default('default') }}"
    _ttl_days: "{{ ttl_days | default(7) }}"

    size_map:
      "4": t3.medium
      "8": t3.large
      "16": t3.xlarge
      "32": t3.2xlarge
    instance_type: "{{ size_map[_memory_gb | string] | default('t3.large') }}"

    ssh_opts: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"

    # Map friendly package names to RHEL repo names
    # Handles postgresql16, postgresql-16, postgresql, etc.
    resolved_packages: >-
      {{ _packages | replace(',', ' ')
         | regex_replace('postgresql[-\\s]?\\d*', 'postgresql-server') }}

  tasks:
    # ---- Find the latest RHEL AMI ----
    - name: Look up latest RHEL {{ _rhel_version }} AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        filters:
          name: "RHEL-{{ _rhel_version }}*-x86_64-*"
          architecture: x86_64
        owners: ["309956199498"]
      register: ami_result

    - name: Select newest AMI
      ansible.builtin.set_fact:
        ami_id: "{{ (ami_result.images | sort(attribute='creation_date') | last).image_id }}"

    # ---- Network ----
    - name: Create security group
      amazon.aws.ec2_security_group:
        name: "sandbox-{{ _team }}-{{ lookup('pipe', 'date +%s') }}"
        description: "Developer sandbox for {{ _team }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ dev_cidr }}"
          - proto: tcp
            from_port: 5432
            to_port: 5432
            cidr_ip: "{{ dev_cidr }}"
        tags:
          benchmark: aap-token-bench
          team: "{{ _team }}"
      register: sg

    # ---- Launch ----
    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ ssh_key_name }}"
        security_group: "{{ sg.group_id }}"
        tags:
          Name: "sandbox-{{ _team }}"
          benchmark: aap-token-bench
          team: "{{ _team }}"
          ttl_days: "{{ _ttl_days | string }}"
          managed_by: aap
        wait: true
        state: running
      register: ec2

    - name: Record instance details
      ansible.builtin.set_fact:
        instance_id: "{{ ec2.instances[0].instance_id }}"
        instance_ip: "{{ ec2.instances[0].public_ip_address }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ instance_ip }}"
        port: 22
        timeout: 300

    - name: Wait for cloud-init
      ansible.builtin.command:
        cmd: ssh {{ ssh_opts }} ec2-user@{{ instance_ip }} "cloud-init status --wait"
      retries: 10
      delay: 15
      until: cloud_init.rc == 0
      register: cloud_init
      changed_when: false

    # ---- Configure ----
    - name: Install packages
      ansible.builtin.command:
        cmd: ssh {{ ssh_opts }} ec2-user@{{ instance_ip }} "sudo dnf install -y {{ resolved_packages }}"
      when: _packages | length > 0
      register: install
      changed_when: "'Complete!' in install.stdout"

    - name: Initialise and start PostgreSQL
      ansible.builtin.command:
        cmd: >-
          ssh {{ ssh_opts }} ec2-user@{{ instance_ip }}
          "sudo /usr/bin/postgresql-setup --initdb 2>/dev/null ||
           sudo postgresql-setup --initdb 2>/dev/null ||
           sudo /usr/pgsql-*/bin/postgresql-*-setup initdb;
           sudo systemctl enable --now postgresql"
      when: "'postgresql' in _packages"
      register: pg
      failed_when: pg.rc != 0 and 'already initialized' not in pg.stderr
      changed_when: true

    - name: Harden SSH
      ansible.builtin.command:
        cmd: >-
          ssh {{ ssh_opts }} ec2-user@{{ instance_ip }}
          "sudo sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
          && sudo sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          && sudo systemctl restart sshd"
      changed_when: true

    # ---- CMDB registration (stub) ----
    # In production, replace with servicenow.itsm.configuration_item or similar.
    - name: Register in CMDB (stub)
      ansible.builtin.copy:
        dest: "{{ cmdb_path }}"
        content: |
          {
            "instance_id": "{{ instance_id }}",
            "ip": "{{ instance_ip }}",
            "team": "{{ _team }}",
            "ttl_days": {{ _ttl_days }},
            "created": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}",
            "managed_by": "aap"
          }

    - name: Done
      ansible.builtin.debug:
        msg: >-
          ✅ Sandbox ready — {{ instance_id }} ({{ instance_ip }})
          RHEL {{ _rhel_version }}, {{ instance_type }}, team={{ _team }},
          ttl={{ _ttl_days }}d. Run ./scripts/cleanup.sh to tear down.
