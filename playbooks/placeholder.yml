---
# Placeholder playbook for the stub templates in the Developer Self-Service
# catalog. Five templates have real playbooks (provision, open port, health,
# restart, tail logs). The rest exist so the agent has a 20-item selection
# problem. The session test only launches the five real ones.
- name: Placeholder
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: This template is a placeholder
      ansible.builtin.debug:
        msg: >-
          This is a stub template. It exists in the catalog so the agent has
          to choose between 20 options, but it does not perform real work.
          Only provision-dev-sandbox has a real playbook.
